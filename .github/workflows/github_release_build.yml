name: GitHub Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to create the release under (e.g. nix-v0.53.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clone nix-edition launcher for the composite termux-shared build
        shell: bash
        run: |
          git clone --depth 1 --branch nix-edition "https://github.com/${GITHUB_REPOSITORY_OWNER}/termux-launcher.git" ../termux-launcher

      - name: Build and release
        shell: bash
        run: |
          set -e
          APK_DIR_PATH="./app/build/outputs/apk/debug"
          APK_VERSION_TAG="${RELEASE_TAG}+github.debug"
          APK_BASENAME_PREFIX="termux-api-nix-app_$APK_VERSION_TAG"

          export TERMUX_API_APP__BUILD__APK_VERSION_TAG="$APK_VERSION_TAG"
          ./gradlew assembleDebug

          test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}.apk"
          (cd "$APK_DIR_PATH"; sha256sum "${APK_BASENAME_PREFIX}.apk" > checksums-sha256.txt)

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "Termux:API for the Termux Launcher Nix edition (com.termux.launcher.nix.api). Debug-signed with the shared testkey — installs alongside the nix-edition launcher." \
            "$APK_DIR_PATH/${APK_BASENAME_PREFIX}.apk" \
            "$APK_DIR_PATH/checksums-sha256.txt"
